<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
 body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:10px}
 .player{width:100%;max-width:700px;position:relative;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8)}
 video{width:100%;height:auto;display:block}
 #clickLayer{position:absolute;inset:0;z-index:99;background:rgba(0,0,0,0.15);display:flex;justify-content:center;align-items:center;cursor:pointer}
 #clickLayer span{width:75px;height:75px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:32px;box-shadow:0 4px 15px rgba(0,0,0,.5)}
</style>
<!-- TARUH POPUNDER ADSTERRA DISINI KALO PUNYA -->
<!-- <script src='//plXXXX.profitablegatecpm.com/XX/XXXX.js'></script> -->
</head>
<body>

<div class="player">
  <video id="vid" controls playsinline preload="metadata">
    <!-- GANTI LINK DI BAWAH INI DENGAN LINK VIDEO DARI ISSUE GITHUB KAMU -->
    <source src="https://github.com/moneraprivate/videos1/issues/3#issue-5505682595" type="video/mp4">
  </video>
  <div id="clickLayer" onclick="goAd()"><span>▶</span></div>
</div>

<script>
  // GANTI INI DENGAN DIRECT LINK ADSTERRA KAMU
  var adsterraLink = "https://www.profitableratecpmnetwork.com/u5za3gxn?key=0d25742f750812c1d9b1709524247e27";
  
  var sudahKlik = false;
  function goAd(){
    if(!sudahKlik){
      window.open(adsterraLink, "_blank");
      sudahKlik = true;
    }
    document.getElementById("clickLayer").style.display="none";
    document.getElementById("vid").play();
  }
</script>

</body>
</html>
