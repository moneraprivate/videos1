<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Saya</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background:#0d1117; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:16px; max-width:720px; width:100%; overflow:hidden; }
  .card-header { padding:24px; border-bottom:1px solid #30363d; text-align:center; }
  .card-header h1 { font-size:22px; }
  .card-header p { color:#8b949e; margin-top:6px; font-size:14px; }
  .video-wrap { background:#000; width:100%; aspect-ratio:16/9; }
  video { width:100%; height:100%; display:block; }
  .card-footer { padding:12px 24px; text-align:center; border-top:1px solid #30363d; }
  .card-footer code { color:#8b949e; font-size:12px; }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>Demo Video Project Saya</h1>
    <p>Video preview</p>
  </div>

  <div class="video-wrap">
    <video controls autoplay muted loop playsinline>
      <source src="demo.mp4" type="video/mp4">
    </video>
  </div>

  <div class="card-footer">
    <code>© 2026</code>
  </div>
</div>

</body>
</html>
