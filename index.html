<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Saya - GitHub Pages</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background:#0d1117; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:16px; max-width:720px; width:100%; overflow:hidden; }
  .card-header { padding:24px; border-bottom:1px solid #30363d; }
  .card-header h1 { font-size:22px; }
  .card-header p { color:#8b949e; margin-top:6px; font-size:14px; }
  .video-wrap { background:#000; width:100%; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; }
  video { width:100%; height:100%; }
  .card-footer { padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
  .btn { background:#238636; color:#fff; padding:10px 16px; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; }
  .btn:hover { background:#2ea043; }
  code { background:#0d1117; padding:4px 8px; border-radius:6px; color:#8b949e; font-size:12px; }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>Demo Video Project Saya</h1>
    <p>Video ini di-host langsung di GitHub dan bisa di-play</p>
  </div>

  <div class="video-wrap">
    <!-- GANTI SRC DI BAWAH INI DENGAN LINK VIDEO KAMU -->
    <video controls poster="">
      <source src="demo.mp4" type="video/mp4">
      Browser kamu tidak support video.
    </video>
  </div>

  <div class="card-footer">
    <code>moneraprivate/videos1</code>
    <a class="btn" href="https://github.com/moneraprivate/videos1" target="_blank">Lihat Repo</a>
  </div>
</div>

</body>
</html>
